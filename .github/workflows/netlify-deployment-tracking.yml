name: Track Netlify Deployments

on:
  push:
    branches:
      - master
      - development

jobs:
  track-deployment:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    
    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "name=production" >> $GITHUB_OUTPUT
            echo "url=https://sanwo.netlify.app" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/development" ]; then
            echo "name=staging" >> $GITHUB_OUTPUT
            echo "url=https://sanwo-dev.netlify.app" >> $GITHUB_OUTPUT
          fi
      
      - name: Create deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: '${{ steps.env.outputs.name }}',
              auto_merge: false,
              required_contexts: [],
              description: 'Netlify deployment tracking'
            });
            
            if (deployment.status === 201) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.data.id,
                state: 'success',
                environment_url: '${{ steps.env.outputs.url }}',
                description: 'Deployed via Netlify'
              });
            }
